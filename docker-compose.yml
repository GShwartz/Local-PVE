version: "3.9"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  harbor_registry_data:
  harbor_database_data:
  harbor_redis_data:
  minio_data:

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: local-pve-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: local_pve
      POSTGRES_USER: ${POSTGRES_USER:-gil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gil} -d local_pve"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local-pve-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gil}:${POSTGRES_PASSWORD}@postgres:5432/local_pve
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: local-pve-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── MinIO (S3-compatible storage) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: local-pve-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console

  # ── Harbor Dependencies ─────────────────────────────────────────────────────
  harbor-db:
    image: postgres:14-alpine
    container_name: harbor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor123
    volumes:
      - harbor_database_data:/var/lib/postgresql/data

  harbor-redis:
    image: redis:7-alpine
    container_name: harbor-redis
    restart: unless-stopped
    volumes:
      - harbor_redis_data:/data

  harbor-registry:
    image: goharbor/registry-photon:v2.10.0
    container_name: harbor-registry
    restart: unless-stopped
    volumes:
      - harbor_registry_data:/storage
    depends_on:
      - harbor-db
      - harbor-redis

  harbor-core:
    image: goharbor/harbor-core:v2.10.0
    container_name: harbor-core
    restart: unless-stopped
    environment:
      CORE_SECRET: "core-secret"
      JOBSERVICE_SECRET: "job-secret"
      DATABASE_TYPE: "postgresql"
      POSTGRESQL_HOST: harbor-db
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: registry
      POSTGRESQL_USERNAME: harbor
      POSTGRESQL_PASSWORD: harbor123
      REDIS_HOST: harbor-redis
      REDIS_PORT: 6379
    depends_on:
      - harbor-db
      - harbor-redis

  harbor-portal:
    image: goharbor/harbor-portal:v2.10.0
    container_name: harbor-portal
    restart: unless-stopped

  harbor-jobservice:
    image: goharbor/harbor-jobservice:v2.10.0
    container_name: harbor-jobservice
    restart: unless-stopped
    environment:
      CORE_SECRET: "core-secret"
      JOBSERVICE_SECRET: "job-secret"
    depends_on:
      - harbor-core

  harbor-nginx:
    image: goharbor/nginx-photon:v2.10.0
    container_name: harbor-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - harbor-core
      - harbor-portal
      