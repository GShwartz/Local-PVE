version: "3.9"

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  helpers_data:

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: local-pve-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: local_pve
      POSTGRES_USER: ${POSTGRES_USER:-gil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gil} -d local_pve"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Helpers / Files sidecar ──────────────────────────────────────────────────
  # Always-alive container that holds scripts, templates, and cloud-init files.
  # Other services mount the same named volume to access these files.
  helpers:
    image: alpine:3.19
    container_name: local-pve-helpers
    restart: unless-stopped
    volumes:
      - ./helpers:/helpers:ro          # host source → read-only inside container
      - helpers_data:/data/helpers     # writable copy written at startup
    command: >
      sh -c "
        cp -r /helpers/. /data/helpers/ &&
        echo 'Helpers synced. Watching for changes…' &&
        while true; do
          sleep 3600 &&
          cp -r /helpers/. /data/helpers/;
        done
      "
    healthcheck:
      test: ["CMD", "test", "-d", "/data/helpers/cloud-init"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local-pve-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override DB host to point at the postgres container
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gil}:${POSTGRES_PASSWORD}@postgres:5432/local_pve
    volumes:
      - helpers_data:/app/helpers:ro   # access scripts/templates from helpers sidecar
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      helpers:
        condition: service_healthy

  # ── React Frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: local-pve-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
